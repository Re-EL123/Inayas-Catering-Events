<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Inayas Catering & Events – Company Profile</title>
<meta name="description" content="Inayas Catering & Events – 100% Black-owned, BBBEE Level 1 catering & event management company in South Africa. Unique Flavours, Unforgettable Events." />
<meta name="theme-color" content="#5a3e36" />

<!-- Favicon -->
<link rel="icon" href="assets/images/logo.jpg" type="image/jpeg"/>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

<!-- Font Awesome (icons) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

<!-- AOS (scroll animations) -->
<link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css"/>

<!-- Swiper (live carousel) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<!-- html2pdf.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>

<style>
  :root{
    --brown-dark:#5a3e36;
    --brown:#7a5346;
    --gold:#d29b63;
    --gold-light:#f0c694;
    --cream:#fff9f0;
    --cream2:#fff4e8;
    --text:#333;
    --radius:14px;
    --shadow:0 10px 30px rgba(90,62,54,0.12);
    --transition:.4s cubic-bezier(.25,.8,.25,1);
    --container-pad: clamp(16px, 5vw, 40px);
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Montserrat',sans-serif;}
  html{scroll-behavior:smooth;overflow-x:hidden;}
  body{background:var(--cream);color:var(--text);line-height:1.7;overflow-x:hidden;}
  img{max-width:100%;display:block;}
  h1,h2,h3{font-family:'Playfair Display',serif;color:var(--brown-dark);margin-bottom:16px;}
  h2{font-size:clamp(1.6rem,4vw,2.2rem);text-align:center;position:relative;padding-bottom:14px;}
  h2::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:70px;height:3px;background:linear-gradient(90deg,var(--gold),var(--brown-dark));border-radius:4px;}
  p,ul{margin-bottom:16px;}
  a{text-decoration:none;}
  .container{width:92%;max-width:1200px;margin:auto;padding-left:var(--container-pad);padding-right:var(--container-pad);}
  section{padding:clamp(50px,8vw,80px) 0;position:relative;scroll-margin-top:80px;}
  .section-alt{background:var(--cream2);}
  .lead-text{text-align:center;max-width:800px;margin:0 auto 40px;color:#6b5b53;font-size:clamp(.92rem,2vw,1rem);}

  /* ===== PRELOADER ===== */
  #preloader{position:fixed;inset:0;background:var(--brown-dark);z-index:9999;display:flex;align-items:center;justify-content:center;transition:opacity .6s ease, visibility .6s ease;}
  #preloader img{width:90px;height:90px;border-radius:50%;animation:pulse 1.2s ease-in-out infinite;}
  #preloader.hide{opacity:0;visibility:hidden;}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.15);opacity:.7;}}

  /* ===== NAVBAR ===== */
  nav.navbar{position:fixed;top:0;left:0;width:100%;z-index:1000;display:flex;align-items:center;justify-content:space-between;padding:14px clamp(16px,4vw,5%);transition:var(--transition);background:transparent;}
  nav.navbar.scrolled{background:rgba(90,62,54,0.95);backdrop-filter:blur(8px);box-shadow:0 4px 20px rgba(0,0,0,.2);padding:10px clamp(16px,4vw,5%);}
  .nav-logo{display:flex;align-items:center;gap:10px;min-width:0;}
  .nav-logo img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);flex-shrink:0;}
  .nav-logo span{color:#fff;font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(.85rem,2vw,1.1rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .nav-links{display:flex;gap:clamp(14px,2vw,28px);list-style:none;}
  .nav-links a{color:#fff;font-weight:500;font-size:.95rem;position:relative;padding-bottom:4px;white-space:nowrap;}
  .nav-links a::after{content:'';position:absolute;bottom:0;left:0;width:0;height:2px;background:var(--gold);transition:var(--transition);}
  .nav-links a:hover::after{width:100%;}
  .nav-cta{background:var(--gold);color:#fff!important;padding:9px 16px;border-radius:30px;font-weight:600;display:flex;align-items:center;gap:8px;font-size:.88rem;white-space:nowrap;flex-shrink:0;}
  .nav-cta:hover{background:var(--brown-dark);}
  .hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;flex-shrink:0;z-index:1001;}
  .hamburger span{width:26px;height:3px;background:#fff;border-radius:2px;transition:var(--transition);}
  .hamburger.active span:nth-child(1){transform:translateY(8px) rotate(45deg);}
  .hamburger.active span:nth-child(2){opacity:0;}
  .hamburger.active span:nth-child(3){transform:translateY(-8px) rotate(-45deg);}

  @media(max-width:1100px){
    .nav-links{gap:14px;}
    .nav-links a{font-size:.85rem;}
  }
  @media(max-width:900px){
    .nav-links{position:fixed;top:0;right:-100%;height:100vh;width:min(78%,320px);background:var(--brown-dark);flex-direction:column;justify-content:center;align-items:center;transition:right .4s ease;gap:28px;box-shadow:-8px 0 30px rgba(0,0,0,.3);}
    .nav-links.open{right:0;}
    .nav-links a{font-size:1rem;}
    .nav-cta{display:none;}
    .hamburger{display:flex;}
  }
  @media(max-width:380px){
    .nav-logo span{display:none;}
  }

  /* ===================================================================
     HERO
  =================================================================== */
  .slide{min-height:100svh;height:100vh;position:relative;background:#2a1b16;display:flex;align-items:center;}

  /* Isolated visual layer: ONLY the video/overlay/blobs are clipped here.
     This prevents the floating stats bar below from being cut off. */
  .hero-visual{position:absolute;inset:0;overflow:hidden;z-index:0;}

  .slide-video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:0;}
  .overlay{position:absolute;inset:0;background:linear-gradient(160deg,rgba(40,25,20,.88) 0%,rgba(90,62,54,.65) 45%,rgba(40,25,20,.85) 100%);z-index:1;}

  .hero-blob{position:absolute;border-radius:50%;filter:blur(70px);z-index:1;opacity:.5;pointer-events:none;}
  .blob1{width:clamp(220px,40vw,420px);height:clamp(220px,40vw,420px);background:radial-gradient(circle,var(--gold) 0%,transparent 70%);top:-100px;right:-80px;animation:floatBlob 9s ease-in-out infinite;}
  .blob2{width:clamp(200px,36vw,380px);height:clamp(200px,36vw,380px);background:radial-gradient(circle,var(--gold-light) 0%,transparent 70%);bottom:-120px;left:-80px;animation:floatBlob 11s ease-in-out infinite reverse;}
  @keyframes floatBlob{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(20px,-18px) scale(1.1);}}

  .logo{position:absolute;top:18px;left:18px;width:clamp(54px,8vw,76px);height:clamp(54px,8vw,76px);border-radius:50%;object-fit:cover;border:3px solid var(--gold);z-index:3;box-shadow:0 8px 24px rgba(0,0,0,.4);}

  .content{position:relative;z-index:2;text-align:center;color:#fff;width:100%;padding:90px 0 60px;display:flex;flex-direction:column;align-items:center;justify-content:center;}

  .hero-glass-card{
    max-width:760px;width:100%;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.18);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-radius:22px;
    padding:clamp(28px,5vw,48px) clamp(20px,5vw,42px);
    box-shadow:0 25px 60px rgba(0,0,0,.35);
  }
  .hero-kicker{display:inline-block;opacity:0;transform:translateY(20px);background:rgba(210,155,99,.18);border:1px solid var(--gold);color:var(--gold-light);font-size:clamp(.66rem,1.6vw,.78rem);letter-spacing:1px;text-transform:uppercase;padding:7px 16px;border-radius:30px;margin-bottom:18px;}

  .content h1{color:#fff;font-size:clamp(1.9rem,6vw,3.2rem);letter-spacing:.4px;opacity:0;transform:translateY(30px);line-height:1.15;}

  .tagline-wrap{opacity:0;transform:translateY(30px);margin:14px 0 8px;}
  .tagline{
    font-size:clamp(1rem,2.6vw,1.2rem);
    font-style:italic;
    margin:0;
    display:inline-block;
    background:linear-gradient(90deg,var(--gold-light),#fff,var(--gold-light));
    background-size:200% auto;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:shimmer 4s linear infinite;
  }
  @keyframes shimmer{
    0%{background-position:0% center;}
    100%{background-position:200% center;}
  }

  /* LIVE ANIMATED ROTATOR TEXT */
  .hero-rotator{
    opacity:0;transform:translateY(30px);
    font-size:clamp(.85rem,2.2vw,1rem);
    color:rgba(255,255,255,.85);
    margin-bottom:24px;
    display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;
  }
  .hero-rotator .static-label{color:var(--gold-light);text-transform:uppercase;letter-spacing:1px;font-size:.75em;font-weight:600;}
  .rotate-text-box{display:inline-flex;align-items:center;font-weight:600;color:#fff;min-height:1.4em;}
  .rotate-text-box .cursor{display:inline-block;width:2px;height:1em;background:var(--gold);margin-left:3px;animation:blinkCursor .85s step-end infinite;}
  @keyframes blinkCursor{0%,100%{opacity:1;}50%{opacity:0;}}

  .hero-badges{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:28px;opacity:0;transform:translateY(30px);}
  .badge{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);padding:6px 14px;border-radius:20px;font-size:clamp(.68rem,1.6vw,.78rem);color:#fff;backdrop-filter:blur(4px);white-space:nowrap;}
  .hero-btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;opacity:0;transform:translateY(30px);}
  .btn{padding:12px clamp(18px,3vw,28px);border:none;font-size:clamp(.85rem,2vw,1rem);cursor:pointer;border-radius:30px;font-weight:600;transition:var(--transition);display:inline-flex;align-items:center;gap:8px;}
  .btn-download{background:var(--gold);color:#fff;}
  .btn-download:hover{background:#fff;color:var(--brown-dark);transform:translateY(-3px);}
  .btn-download:disabled{opacity:.7;cursor:not-allowed;transform:none;}
  .btn-whatsapp{background:#25D366;color:#fff;}
  .btn-whatsapp:hover{background:#1ebe57;transform:translateY(-3px);}

  .hero-stats-bar{
    position:absolute;left:50%;bottom:-44px;transform:translateX(-50%);
    z-index:4;width:92%;max-width:920px;
    display:flex;gap:16px;
  }
  .hero-stat-card{
    flex:1;text-align:center;color:#fff;
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.25);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-radius:16px;padding:clamp(12px,2.5vw,18px) 8px;
    box-shadow:0 14px 34px rgba(0,0,0,.25);
    opacity:0;transform:translateY(30px);
    min-width:0;
  }
  .hero-stat-card i{color:var(--gold-light);font-size:clamp(1rem,2.4vw,1.3rem);margin-bottom:6px;display:block;}
  .hero-stat-card .num{font-family:'Playfair Display',serif;font-size:clamp(1.1rem,3vw,1.6rem);font-weight:800;}
  .hero-stat-card .lbl{font-size:clamp(.6rem,1.6vw,.72rem);text-transform:uppercase;letter-spacing:.5px;color:rgba(255,255,255,.75);}

  .scroll-cue{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:2;color:#fff;animation:bounce 1.8s infinite;font-size:1.2rem;opacity:.8;}
  @keyframes bounce{0%,100%{transform:translate(-50%,0);}50%{transform:translate(-50%,10px);}}

  #vmv{padding-top:clamp(90px,15vw,150px);}

  @media(max-width:760px){
    .hero-stats-bar{position:static;transform:none;margin:30px auto 0;flex-wrap:wrap;}
    .hero-stat-card{min-width:130px;}
    #vmv{padding-top:60px;}
    .content{padding:80px 0 40px;}
  }
  @media(max-width:420px){
    .hero-stats-bar{flex-direction:column;}
  }

  /* ===== IMAGE FRAMES ===== */
  .hex{
    width:clamp(120px,22vw,180px);
    height:clamp(135px,24vw,200px);
    clip-path:polygon(25% 6.7%,75% 6.7%,100% 50%,75% 93.3%,25% 93.3%,0% 50%);
    overflow:hidden;margin:8px;display:inline-block;box-shadow:var(--shadow);transition:var(--transition);
  }
  .hex:hover,.circle:hover,.mosaic:hover{transform:scale(1.06) rotate(1deg);}
  .circle{
    width:clamp(100px,20vw,160px);
    height:clamp(100px,20vw,160px);
    border-radius:50%;overflow:hidden;margin:8px;display:inline-block;box-shadow:var(--shadow);transition:var(--transition);border:4px solid #fff;
  }
  .mosaic{width:100%;height:clamp(180px,30vw,260px);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
  .hex img,.circle img,.mosaic img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease;}
  .hex:hover img,.circle:hover img,.mosaic:hover img{transform:scale(1.15);}

  /* ===== VMV ===== */
  .vmv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(16px,3vw,30px);margin-top:40px;}
  .vmv-card{background:#fff;border-radius:var(--radius);padding:clamp(20px,4vw,30px);text-align:center;box-shadow:var(--shadow);transition:var(--transition);}
  .vmv-card:hover{transform:translateY(-10px);}
  .vmv-card i{font-size:2rem;color:var(--gold);margin-bottom:14px;}
  @media(max-width:768px){ .vmv-grid{grid-template-columns:1fr 1fr;} }
  @media(max-width:560px){ .vmv-grid{grid-template-columns:1fr;} }

  /* ===== ABOUT ===== */
  .about-flex{display:flex;gap:clamp(24px,5vw,50px);flex-wrap:wrap;align-items:center;}
  .about-text{flex:1.2;min-width:280px;}
  .about-images{flex:1;min-width:280px;display:flex;flex-wrap:wrap;justify-content:center;}
  .stat-row{display:flex;gap:16px;flex-wrap:wrap;margin-top:30px;}
  .stat-box{flex:1;min-width:110px;text-align:center;background:#fff;border-radius:var(--radius);padding:16px 8px;box-shadow:var(--shadow);}
  .stat-box .num{font-size:clamp(1.4rem,3vw,1.8rem);font-weight:700;color:var(--gold);font-family:'Playfair Display',serif;}
  .stat-box .label{font-size:.78rem;color:#777;}

  /* ===== SERVICES ===== */
  .grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:clamp(18px,3vw,26px);}
  .card{background:#fff;padding:clamp(16px,3vw,22px);border-radius:var(--radius);box-shadow:var(--shadow);transition:var(--transition);}
  .card:hover{transform:translateY(-10px);box-shadow:0 16px 40px rgba(90,62,54,.2);}
  .card img{width:100%;height:clamp(160px,28vw,190px);object-fit:cover;border-radius:10px;margin-bottom:14px;}
  .card h3{display:flex;align-items:center;gap:10px;font-size:clamp(1.05rem,2.6vw,1.3rem);}
  .card h3 i{color:var(--gold);}

  /* ===== GALLERY / SWIPER ===== */
  .gallery-swiper{padding-bottom:50px!important;}
  .gallery-swiper .swiper-slide{border-radius:var(--radius);overflow:hidden;}
  .swiper-button-next,.swiper-button-prev{color:var(--gold)!important;}
  .swiper-pagination-bullet-active{background:var(--gold)!important;}
  @media(max-width:480px){
    .swiper-button-next,.swiper-button-prev{display:none;}
  }

  /* ===== IMPACT / COUNTERS ===== */
  .counters{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(20px,5vw,40px);margin-bottom:50px;}
  .counter-item{text-align:center;}
  .counter-item .count{font-size:clamp(2rem,5vw,3rem);font-weight:800;color:var(--brown-dark);font-family:'Playfair Display',serif;}
  .counter-item .count span{color:var(--gold);}
  .counter-item .label{text-transform:uppercase;letter-spacing:1px;font-size:.78rem;color:#777;}
  .charts-flex{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:20px;}
  .chart-box{flex:1;min-width:280px;padding:clamp(14px,3vw,20px);background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);}

  /* ===== LEAD FORM ===== */
  .lead-section{background:linear-gradient(135deg,var(--brown-dark),#3f2a24);color:#fff;}
  .lead-section h2{color:#fff;}
  .lead-section h2::after{background:linear-gradient(90deg,var(--gold),#fff);}
  .lead-section .lead-text{color:#e8dcd4;}
  .lead-form{max-width:800px;margin:0 auto;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(6px);padding:clamp(22px,5vw,40px);border-radius:var(--radius);}
  .lead-form .row{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .lead-form .full{grid-column:1/-1;}
  .lead-form label{display:block;margin-bottom:6px;font-size:.85rem;color:var(--gold-light);}
  .lead-form input,.lead-form select,.lead-form textarea{width:100%;padding:12px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font-family:'Montserrat',sans-serif;font-size:.95rem;}
  .lead-form input::placeholder,.lead-form textarea::placeholder{color:rgba(255,255,255,.5);}
  .lead-form input:focus,.lead-form select:focus,.lead-form textarea:focus{outline:2px solid var(--gold);background:rgba(255,255,255,.14);}
  .lead-form button{margin-top:24px;width:100%;justify-content:center;background:#25D366;color:#fff;padding:15px;font-size:clamp(.9rem,2vw,1.05rem);}
  .lead-form button:hover{background:#1ebe57;}
  .lead-form select option{color:#333;}
  @media(max-width:680px){ .lead-form .row{grid-template-columns:1fr;} }

  /* ===== FOOTER ===== */
  footer{background:var(--brown-dark);color:#fff;padding:clamp(40px,8vw,60px) 0 20px;}
  .footer-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:28px;margin-bottom:30px;}
  footer h3{color:var(--gold-light);font-size:1.05rem;}
  footer p{font-size:.92rem;word-break:break-word;}
  footer a{color:var(--gold);}
  footer a:hover{color:#fff;}
  .social-icons{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap;}
  .social-icons a{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;color:#fff;transition:var(--transition);}
  .social-icons a:hover{background:var(--gold);transform:translateY(-4px);}
  .footer-bottom{text-align:center;border-top:1px solid rgba(255,255,255,.12);padding-top:18px;font-size:.78rem;color:rgba(255,255,255,.6);}

  /* ===== FLOATING BUTTONS ===== */
  .float-whatsapp{position:fixed;bottom:20px;right:20px;width:58px;height:58px;background:#25D366;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.7rem;z-index:999;box-shadow:0 6px 20px rgba(0,0,0,.3);}
  .float-whatsapp::before{content:'';position:absolute;inset:0;border-radius:50%;background:#25D366;animation:ring 1.8s infinite;z-index:-1;}
  @keyframes ring{0%{box-shadow:0 0 0 0 rgba(37,211,102,.6);}100%{box-shadow:0 0 0 24px rgba(37,211,102,0);}}
  .back-to-top{position:fixed;bottom:20px;right:90px;width:44px;height:44px;background:var(--gold);border-radius:50%;display:none;align-items:center;justify-content:center;color:#fff;z-index:999;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer;transition:var(--transition);}
  .back-to-top:hover{background:var(--brown-dark);}

  @media(max-width:480px){
    .float-whatsapp{width:52px;height:52px;font-size:1.5rem;bottom:14px;right:14px;}
    .back-to-top{width:40px;height:40px;bottom:14px;right:76px;}
  }

  /* ===================================================================
     PDF TEMPLATE (hidden, true A4 pages, used ONLY for PDF generation)
     display:none by default so it contributes ZERO height/scroll to the
     live page. It is toggled to display:block only while html2pdf runs.
     Positioned at top:0,left:0 (NEVER negative) so html2canvas can
     correctly scroll/capture it.
  =================================================================== */
  #pdfTemplate{
    display:none;
    position:absolute;
    top:0;
    left:0;
    width:210mm;
    background:#fff;
    color:#333;
    font-family:'Montserrat',sans-serif;
    z-index:-1;
  }
  .pdf-page{
    width:210mm;
    min-height:297mm;
    padding:16mm 16mm 20mm;
    position:relative;
    background:var(--cream);
    page-break-after:always;
    display:flex;
    flex-direction:column;
  }
  .pdf-page:last-child{page-break-after:auto;}
  .pdf-page.pdf-cover{padding:0;background:var(--brown-dark);color:#fff;justify-content:center;align-items:center;text-align:center;}

  .pdf-header{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--gold);padding-bottom:10px;margin-bottom:22px;}
  .pdf-header img{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);}
  .pdf-header .pdf-htitle{font-family:'Playfair Display',serif;font-weight:700;color:var(--brown-dark);font-size:15px;}
  .pdf-header .pdf-hsub{font-size:10px;color:#999;margin-left:auto;text-transform:uppercase;letter-spacing:1px;}

  .pdf-h2{font-family:'Playfair Display',serif;font-size:22px;color:var(--brown-dark);margin-bottom:6px;position:relative;padding-bottom:10px;}
  .pdf-h2::after{content:'';position:absolute;bottom:0;left:0;width:60px;height:3px;background:linear-gradient(90deg,var(--gold),var(--brown-dark));border-radius:4px;}
  .pdf-sub{color:#777;font-size:11px;margin-bottom:18px;font-style:italic;}

  .pdf-footer-bar{position:absolute;bottom:10mm;left:16mm;right:16mm;display:flex;justify-content:space-between;font-size:8.5px;color:#9a8c85;border-top:1px solid #e9ddd3;padding-top:7px;}

  .pdf-cover-inner{width:100%;padding:26mm 20mm;position:relative;z-index:2;}
  .pdf-cover-logo{width:90px;height:90px;border-radius:50%;border:3px solid var(--gold);object-fit:cover;margin-bottom:22px;box-shadow:0 10px 30px rgba(0,0,0,.3);}
  .pdf-cover-title{font-family:'Playfair Display',serif;font-size:36px;font-weight:800;margin-bottom:10px;}
  .pdf-cover-tag{font-size:14px;font-style:italic;color:var(--gold-light);margin-bottom:24px;}
  .pdf-cover-badges{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:30px;}
  .pdf-cover-badges span{border:1px solid var(--gold);color:var(--gold-light);font-size:10px;padding:6px 14px;border-radius:20px;letter-spacing:.5px;}
  .pdf-cover-banner{width:100%;max-width:450px;height:230px;border-radius:16px;overflow:hidden;border:3px solid var(--gold);margin:0 auto 26px;box-shadow:0 14px 40px rgba(0,0,0,.4);}
  .pdf-cover-banner img{width:100%;height:100%;object-fit:cover;}
  .pdf-cover-contact{font-size:10.5px;color:#f0e4da;letter-spacing:.3px;}

  .pdf-circle-row{display:flex;gap:16px;justify-content:center;margin-bottom:24px;}
  .pdf-circle-row img{width:100px;height:100px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:var(--shadow);}
  .pdf-vmv-grid{display:flex;gap:14px;}
  .pdf-vmv-card{flex:1;background:#fff;border-radius:10px;padding:16px;box-shadow:0 4px 14px rgba(90,62,54,.1);}
  .pdf-vmv-card i{color:var(--gold);font-size:17px;margin-bottom:6px;display:block;}
  .pdf-vmv-card h4{font-family:'Playfair Display',serif;color:var(--brown-dark);font-size:14px;margin-bottom:6px;}
  .pdf-vmv-card p{font-size:10.5px;color:#555;margin:0;}

  .pdf-about-text{font-size:11.5px;color:#444;text-align:justify;margin-bottom:20px;}
  .pdf-stat-row{display:flex;gap:14px;margin-bottom:22px;}
  .pdf-stat-box{flex:1;text-align:center;background:#fff;border-radius:10px;padding:14px 6px;box-shadow:0 4px 14px rgba(90,62,54,.1);}
  .pdf-stat-box .num{font-family:'Playfair Display',serif;font-size:18px;color:var(--gold);font-weight:800;}
  .pdf-stat-box .label{font-size:9px;color:#888;text-transform:uppercase;letter-spacing:.5px;}
  .pdf-img-row{display:flex;gap:14px;}
  .pdf-img-row .pdf-img{flex:1;height:120px;border-radius:10px;overflow:hidden;box-shadow:var(--shadow);}
  .pdf-img-row .pdf-img img{width:100%;height:100%;object-fit:cover;}

  .pdf-service-card{display:flex;gap:16px;background:#fff;border-radius:10px;padding:14px;margin-bottom:16px;box-shadow:0 4px 14px rgba(90,62,54,.1);align-items:center;}
  .pdf-service-card img{width:130px;height:95px;object-fit:cover;border-radius:8px;flex-shrink:0;}
  .pdf-service-card h4{font-family:'Playfair Display',serif;color:var(--brown-dark);font-size:14px;margin-bottom:6px;display:flex;align-items:center;gap:8px;}
  .pdf-service-card h4 i{color:var(--gold);}
  .pdf-service-card p{font-size:10.5px;color:#555;margin:0;}

  .pdf-gallery-grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1;}
  .pdf-gallery-grid2 .g-item{border-radius:12px;overflow:hidden;box-shadow:var(--shadow);height:100%;min-height:110mm;}
  .pdf-gallery-grid2 .g-item img{width:100%;height:100%;object-fit:cover;}

  .pdf-counters{display:flex;gap:14px;margin-bottom:22px;}
  .pdf-counter-box{flex:1;text-align:center;background:#fff;border-radius:10px;padding:18px 6px;box-shadow:0 4px 14px rgba(90,62,54,.1);}
  .pdf-counter-box .num{font-family:'Playfair Display',serif;font-size:24px;font-weight:800;color:var(--brown-dark);}
  .pdf-counter-box .num span{color:var(--gold);}
  .pdf-counter-box .label{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:#888;}

  /* Fixed: give the chart wrapper a real, positioned box instead of
     forcing conflicting width/height directly on the <canvas> — this
     was causing the PDF charts to render blank. */
  .pdf-chart-box{background:#fff;border-radius:10px;padding:16px;box-shadow:0 4px 14px rgba(90,62,54,.1);margin-bottom:18px;position:relative;height:240px;}
  .pdf-chart-box canvas{max-width:100%;}
